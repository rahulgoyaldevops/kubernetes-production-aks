# Zero-Trust Secretless Workload Identity Integration
# Author: Rahul Goyal (14+ Years Total IT | Senior DevOps Engineer)
# ============================================================================

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secret-provider
  namespace: core-apps
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${AZURE_CLIENT_ID}" # Workload Identity User-Assigned Managed Identity Client ID
    keyvaultName: "rgdevopskv001"
    cloudName: "AzurePublicCloud"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: db-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: app-encryption-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: tls-wildcard-cert
          objectType: cert
          objectVersion: ""
  # Declarative synchronization to native Kubernetes Secrets for legacy/environment consumption
  secretObjects:
    - secretName: app-database-credentials
      type: Opaque
      data:
        - objectName: db-connection-string
          key: DB_CONNECTION_STRING
    - secretName: app-security-keys
      type: Opaque
      data:
        - objectName: app-encryption-key
          key: ENCRYPTION_KEY
